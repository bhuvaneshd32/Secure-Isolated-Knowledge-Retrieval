version: '3.8'

services:
  api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PRIVRAG_STORE=${PRIVRAG_STORE:-A}
      - PRIVRAG_DB_PATH=/app/db/privrag.db
      - PRIVRAG_LLM=${PRIVRAG_LLM:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Volumes for data persistence and cache mapping
      - sqlite_data:/app/db
      - model_cache:/app/model_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sqlite_data:
  model_cache: